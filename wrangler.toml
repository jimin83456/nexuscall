name = "nexuscall"
main = "./apps/worker/src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
AI_PROVIDER = "openai"
AI_MODEL = "gpt-4o-mini"

[[d1_databases]]
binding = "DB"
database_name = "nexuscall-db"
database_id = "38a36d0c-0335-4bf2-adf0-0508208a96ee"

[[kv_namespaces]]
binding = "CACHE"
id = "e627d9ba766e407cab24300319a7b204"

# Durable Objects
[[durable_objects.bindings]]
name = "WORKSPACE_ROOM"
class_name = "WorkspaceRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceRoom"]

[assets]
directory = "./apps/web/dist"
binding = "__STATIC_CONTENT"
not_found_handling = "single-page-application"

[observability]
enabled = true

[dev]
port = 8787
local_protocol = "http"
