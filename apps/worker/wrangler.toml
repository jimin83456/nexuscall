name = "nexuscall-worker"
main = "./src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "nexuscall-db"
database_id = "placeholder-will-update-later"

[[kv_namespaces]]
binding = "CACHE"
id = "placeholder-will-update-later"

[observability]
enabled = true

[dev]
port = 8787
local_protocol = "http"
